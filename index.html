<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>vendor-scout · 화장품 제조업체 사전검증 리포트</title>
  <meta name="description" content="업체명 입력 → 공공 API 실시간 조회 → 조회시점 스냅샷 리포트 → 방문 크로스체크. 화장품 제조업체 신규처 발굴용 사전 정보 확보·검증 서비스.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%232f6df6'/><text x='50' y='70' font-size='60' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>V</text></svg>">
  <link rel="stylesheet" href="assets/styles.css?v=151">
  <!-- 저장해 둔 테마를 첫 그림 전에 입힌다. app.js는 문서 끝에서 로드돼서 거기서 하면
       밝은 화면이 한 번 번쩍인 뒤 어두워진다. 그래서 이 한 조각만 인라인으로 둔다. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('vs_theme');
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
      } catch (e) { /* 저장소 차단(사생활 보호 모드 등) — 기기 설정을 그대로 따른다 */ }
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <div class="logo">
        <span class="mark">V</span>
        <span class="logo-txt"><b>vendor-scout</b><small>화장품 제조업체 사전검증</small></span>
      </div>
      <span class="spacer"></span>
      <div class="themesel" role="group" aria-label="화면 테마">
        <button type="button" class="thbtn" data-set-theme="light" title="밝은 화면으로 고정">밝게</button>
        <button type="button" class="thbtn" data-set-theme="dark" title="어두운 화면으로 고정">어둡게</button>
        <button type="button" class="thbtn" data-set-theme="auto" title="기기 설정을 따름">자동</button>
      </div>
      <button type="button" id="proxyBtn" class="proxybtn" title="식약처 data.go.kr 실데이터 프록시 연결">🔌 실데이터 연결</button>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <form id="searchForm" class="searchbar" autocomplete="off">
        <input id="q" type="text" placeholder="업체명 (예 : 코스맥스)" aria-label="업체명">
        <input id="bno" type="text" inputmode="numeric" placeholder="사업자번호 (선택 · 예 143-81-19635)" aria-label="사업자등록번호">
        <button type="submit">사전검증 조회</button>
      </form>
      <div id="recent" class="recent hidden"></div>
    </section>

    <section id="report" class="report hidden"></section>
  </main>

  <footer>
    <div class="wrap">
      <span>출처: 식약처 · 금융위 · 국민연금 · 국세청 · 산업단지공단 (data.go.kr) · 네이버 · 카카오</span>
      <!-- 빌드 표시 — 캐시된 옛 스크립트가 도는지 한눈에 확인하려고 둔다(app.js가 채움) -->
      <span id="buildStamp" class="build-stamp"></span>
    </div>
  </footer>

  <script src="assets/samples.js?v=151"></script>
  <script src="assets/app.js?v=151"></script>
</body>
</html>
