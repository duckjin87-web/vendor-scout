name: Diagnose wastewater datasets

# 폐수배출시설 공공데이터를 찾는다 — ① 포털 목록 검색 ② 행정안전부 인허가 API 이름 후보 호출. 커밋 없음.
on:
  workflow_dispatch:
    inputs:
      keyword: { description: '포털 검색어', required: true, type: string, default: '폐수배출시설' }
      name: { description: '시험 조회 상호', required: true, type: string, default: '한국콜마' }

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Probe
        env:
          KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
          KW: ${{ inputs.keyword }}
          NM: ${{ inputs.name }}
        run: |
          cat > d.mjs <<'JS'
          const n = (t) => console.log('::notice::' + String(t).replace(/\r?\n/g, ' ').slice(0, 3000));
          const UA = { 'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36' };
          const KEY = encodeURIComponent(process.env.KEY);
          // 국립환경과학원 산업계(전국오염원조사)
          for (const extra of ['', '&type=json', '&type=json&numOfRows=3&pageNo=1', '&_type=json&numOfRows=3&pageNo=1']) {
            try {
              const r = await fetch(`https://apis.data.go.kr/1480523/IndryService/getIndryInfo?serviceKey=${KEY}${extra}`);
              n(`[IndryService ${extra || '기본'}] ${r.status} :: ${(await r.text()).slice(0, 1500)}`);
            } catch (e) { n(`[IndryService] 실패 ${e.message}`); }
          }
          try {
            const h = await (await fetch('https://www.data.go.kr/data/15057129/openapi.do', { headers: UA })).text();
            const txt = h.replace(/<script[\s\S]*?<\/script>/g, ' ').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ');
            const a = txt.indexOf('요청변수'); n(`[IndryService 요청변수] ${a >= 0 ? txt.slice(a, a + 1500) : '없음'}`);
            const b = txt.indexOf('출력결과'); n(`[IndryService 출력결과] ${b >= 0 ? txt.slice(b, b + 2500) : '없음'}`);
          } catch (e) { n('상세 실패 ' + e.message); }
          // 행정안전부 자원환경 인허가 — 폐수배출시설 이름 후보
          for (const c of ['water_pollution_source_other', 'water_pollution_source', 'water_pollution_source_facility', 'water_pollution_source_installation',
            'wastewater_emission_facility', 'water_pollutant_emission_facility', 'wastewater_discharge_facility_info', 'water_pollution_discharge_facility', 'wastewater_facility']) {
            try {
              const r = await fetch(`https://apis.data.go.kr/1741000/${c}/info?serviceKey=${KEY}&returnType=json&pageNo=1&numOfRows=2&cond[BPLC_NM::LIKE]=${encodeURIComponent(process.env.NM)}`);
              n(`[1741000/${c}] ${r.status} :: ${(await r.text()).slice(0, 700)}`);
            } catch (e) { n(`[${c}] 실패 ${e.message}`); }
          }
          // 포털에서 행정안전부 '자원환경_' 데이터셋 목록
          try {
            const h = await (await fetch(`https://www.data.go.kr/tcs/dss/selectDataSetList.do?keyword=${encodeURIComponent('행정안전부 자원환경')}&perPage=60`, { headers: UA })).text();
            const t = [...new Set([...h.matchAll(/title="(행정안전부_자원환경_[^"]+?)(?: 활용신청| 상세| 바로가기|")/g)].map((m) => m[1]))];
            n(`[자원환경 목록] ${t.join(' | ')}`);
          } catch (e) { n('목록 실패 ' + e.message); }
          JS
          node d.mjs
