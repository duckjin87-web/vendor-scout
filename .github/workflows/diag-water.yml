name: Diagnose wastewater datasets

# 폐수배출시설 공공데이터를 찾는다 — ① 포털 목록 검색 ② 행정안전부 인허가 API 이름 후보 호출. 커밋 없음.
on:
  workflow_dispatch:
    inputs:
      keyword: { description: '포털 검색어', required: true, type: string, default: '폐수배출시설' }
      name: { description: '시험 조회 상호', required: true, type: string, default: '한국콜마' }

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Probe
        env:
          KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
          KW: ${{ inputs.keyword }}
          NM: ${{ inputs.name }}
        run: |
          cat > d.mjs <<'JS'
          const n = (t) => console.log('::notice::' + String(t).replace(/\r?\n/g, ' ').slice(0, 3000));
          const UA = { 'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36' };
          // ① 포털 검색 — 데이터셋 번호 주변 글자에서 제목을 뽑는다
          for (const kw of [process.env.KW, '수질오염물질 배출시설', '폐수배출업소', '수질배출업소', '폐수 배출시설 설치']) {
            try {
              const u = `https://www.data.go.kr/tcs/dss/selectDataSetList.do?keyword=${encodeURIComponent(kw)}&perPage=40`;
              const h = await (await fetch(u, { headers: UA })).text();
              const ids = [...new Set([...h.matchAll(/\/data\/(\d{8})\/(openapi|fileData)\.do/g)].map((m) => `${m[1]}:${m[2]}`))];
              const out = ids.slice(0, 25).map((id) => { const k = h.indexOf(`/data/${id.split(':')[0]}/`); const seg = h.slice(Math.max(0, k - 900), k).replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim(); return `${id} …${seg.slice(-140)}`; });
              n(`[포털 「${kw}」] ${h.length}자 ids ${ids.length} :: ${out.join(' ‖ ')}`);
            } catch (e) { n(`[포털 ${kw}] 실패 ${e.message}`); }
          }
          // ② 행정안전부 인허가 API 이름 후보(대기 = air_pollution_facility_installation)
          const cands = ['wastewater_discharge_facility', 'wastewater_discharge_facility_installation', 'water_pollution_facility_installation',
            'water_pollutant_discharge_facility', 'waste_water_discharge_facility', 'wastewater_discharge_facilities', 'water_pollution_facility',
            'wastewater_facility_installation', 'air_pollution_facility_installation'];
          const key = process.env.KEY;
          for (const c of cands) {
            try {
              const u = `https://apis.data.go.kr/1741000/${c}/info?serviceKey=${encodeURIComponent(key)}&returnType=json&pageNo=1&numOfRows=3&cond[BPLC_NM::LIKE]=${encodeURIComponent(process.env.NM)}`;
              const r = await fetch(u); const t = await r.text();
              n(`[API ${c}] ${r.status} :: ${t.slice(0, 900)}`);
            } catch (e) { n(`[API ${c}] 실패 ${e.message}`); }
          }
          JS
          node d.mjs
