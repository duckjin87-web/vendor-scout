name: Diagnose wastewater datasets

# 폐수배출시설 공공데이터를 찾는다 — ① 포털 목록 검색 ② 행정안전부 인허가 API 이름 후보 호출. 커밋 없음.
on:
  workflow_dispatch:
    inputs:
      keyword: { description: '포털 검색어', required: true, type: string, default: '폐수배출시설' }
      name: { description: '시험 조회 상호', required: true, type: string, default: '한국콜마' }

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Probe
        env:
          KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
          KW: ${{ inputs.keyword }}
          NM: ${{ inputs.name }}
        run: |
          cat > d.mjs <<'JS'
          const n = (t) => console.log('::notice::' + String(t).replace(/\r?\n/g, ' ').slice(0, 3000));
          const UA = { 'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36' };
          // 데이터셋 상세 — 제목·제공기관·요청주소·오퍼레이션·항목
          for (const id of ['15057129', '15154930', '15154989', '15124967', '15113432', '15058140', '15108181']) {
            try {
              let h = await (await fetch(`https://www.data.go.kr/data/${id}/openapi.do`, { headers: UA })).text();
              if (h.length < 3000 || /fileData/.test(h.slice(0, 600))) h = await (await fetch(`https://www.data.go.kr/data/${id}/fileData.do`, { headers: UA })).text();
              const t = (h.match(/<title>([^<]+)/) || [])[1] || '';
              const txt = h.replace(/<script[\s\S]*?<\/script>/g, ' ').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ');
              const urls = [...new Set([...h.matchAll(/https?:\/\/apis\.data\.go\.kr\/[\w/.-]+/g)].map((m) => m[0]))].slice(0, 8);
              const pick = (k, len) => { const a = txt.indexOf(k); return a >= 0 ? txt.slice(a, a + len) : ''; };
              n(`[${id}] ${t} :: 요청 ${urls.join(' ')} :: ${pick('제공기관', 60)} :: ${pick('키워드', 120)} :: ${pick('설명', 500)}`);
              const ops = [...new Set([...h.matchAll(/(get[A-Z]\w{3,60})/g)].map((m) => m[1]))].slice(0, 12);
              if (ops.length) n(`[${id}] 오퍼레이션 ${ops.join(', ')}`);
            } catch (e) { n(`[${id}] 실패 ${e.message}`); }
          }
          JS
          node d.mjs
