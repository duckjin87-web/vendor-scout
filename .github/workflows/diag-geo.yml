name: Diagnose site geo (area tab)

# 배포된 사이트에서 업체를 실제로 조회하고 공장 면적 탭의 브이월드 보강(용도지역·주소 대조·겹쳐 보기·화물차)을 확인한다. 커밋 없음.
on:
  workflow_dispatch:
    inputs:
      site: { description: '사이트 주소', required: true, type: string, default: 'https://vendor-scout-gilt.vercel.app' }
      names: { description: '업체명(쉼표 구분)', required: true, type: string }

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-24.04   # 26.04는 Playwright 미지원
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Check
        env:
          SITE: ${{ inputs.site }}
          NAMES: ${{ inputs.names }}
        run: |
          npm i -s playwright@1.56.1 2>&1 | tail -5
          npx -y playwright@1.56.1 install --with-deps chromium 2>&1 | tail -3
          cat > d.mjs <<'JS'
          import { chromium } from 'playwright';
          const n = (t) => console.log('::notice::' + String(t).replace(/\r?\n/g, ' ').slice(0, 3900));
          const b = await chromium.launch();
          const base = process.env.SITE.replace(/\/$/, '');
          for (const nm of process.env.NAMES.split(',').map((s) => s.trim()).filter(Boolean)) {
            const page = await b.newPage({ viewport: { width: 1280, height: 900 } });
            const errs = [];
            page.on('pageerror', (e) => errs.push('JS ' + e.message.slice(0, 120)));
            try {
              await page.goto(base, { waitUntil: 'domcontentloaded', timeout: 60000 });
              await page.evaluate((p) => { localStorage.clear(); localStorage.setItem('vs_proxy', p); }, `${base}/api/proxy`);
              await page.reload({ waitUntil: 'domcontentloaded' });
              await page.waitForTimeout(1500);
              await page.evaluate(async (nm) => {
                let x = await liveLookup(nm);
                if (x.candidates) { const pick = x.candidates.find((c) => c.mfds) || x.candidates[0]; x = { report: await (pick.mfds ? finishLiveMfds(nm, pick) : finishLive(nm, pick)) }; }
                let rep = x.report; if (rep && rep._late) { const fin = await rep._late; if (fin) rep = fin; }
                render(rep, { noScroll: true });
              }, nm);
              await page.waitForFunction(() => currentReport && currentReport.meta && currentReport.meta.geo, null, { timeout: 60000 }).catch(() => {});
              await page.waitForTimeout(800);
              const geo = await page.evaluate(() => { const G = currentReport.meta.geo || {}; return { err: G.err, src: G.src, parcel: G.site && G.site.parcel && G.site.parcel.addr, uses: G.site && (G.site.uses || []).length, bldgs: G.site && (G.site.bldgs || []).length, ref: G.ref && (G.ref.bldgs || []).length, addrs: G.addrs }; });
              n(`[${nm}] 재무: ${await page.evaluate(() => JSON.stringify((currentReport.finance || []).filter((f) => f.value).slice(0, 6).map((f) => [f.key, f.value, f.source])) + ' · 금융위: ' + JSON.stringify((currentReport.meta.src_status || []).filter((s) => /금융위/.test(s.name)).map((s) => [s.name, s.ok, s.detail])))}`);
              n(`[${nm}] CGMP: ${await page.evaluate(() => { const c = (currentReport.capacity || []).find((x) => x.key === 'CGMP 적합업소'); return JSON.stringify([c && c.value, c && String(c.note).slice(0, 160), (currentReport.meta.cgmp_news || []).map((x) => x.date + ' ' + x.title.slice(0, 40))]); })}`);
              n(`[${nm}] 채용: ${await page.evaluate(() => { const h = currentReport.hiring || {}; return JSON.stringify({ posts: (h.posts || []).length, affil: h.affil, prof: (h.extProfile || []).map((r) => r.key + '=' + r.value), terms: h.terms }); })}`);
              n(`[${nm}] 대표·인력: ${await page.evaluate(() => { const r = (currentReport.basic || []).find((x) => x.key === '대표자'); const W = currentReport.meta.workforce; return JSON.stringify({ rep: r && [r.value, r.source], all: W && W.allR, mfg: W && W.mfgR, nps: W && W.nps }); })}`);
              n(`[${nm}] 위성: ${await page.evaluate(async () => { const r = await fetch(buildProxyUrl({ service: 'vwTile', z: '18', x: '223606', y: '101524' })); return r.status + ' ' + r.headers.get('content-type'); })}`);
              n(`[${nm}] 채용 페이지: ${await page.evaluate(() => JSON.stringify(((currentReport.hiring || {}).extDiag || []).map((d) => [d.host, d.kind, d.ok, d.found || d.why]).slice(0, 14)))}`);
              n(`[${nm}] geo: ${JSON.stringify(geo).slice(0, 900)}`);
              await page.click('#rtab-area').catch(() => {});
              await page.waitForTimeout(600);
              for (const sel of ['.at-cat-area', '.at-cat-cmp', '.at-cat-place', '.at-cat-truck', '.at-cat-air']) {
                const t = await page.$eval(sel, (e) => e.innerText.replace(/\n+/g, ' | ')).catch(() => null);
                if (t) n(`[${nm}] ${sel}: ${t.slice(0, 700)}`);
              }
              n(`[${nm}] 3D: ${await page.evaluate(() => { const c = document.querySelector('.s3-cv'); if (!c) return '없음'; const d = c.getContext('2d').getImageData(0, 0, c.width, c.height).data; let k = 0; for (let i = 3; i < d.length; i += 4) if (d[i]) k++; return `${c.width}×${c.height} 칠한 픽셀 ${k}`; })}`);
              await page.click('[data-s3view="box"]').catch(() => {});
              await page.waitForTimeout(3000);
              n(`[${nm}] 육면체: ${await page.$eval('.at-cat-cmp [data-view="box"]', (e) => (e.hidden ? '(숨김) ' : '') + e.innerText.replace(/\n+/g, ' | ').slice(0, 600)).catch(() => '없음')}`);
              n(`[${nm}] 교차진단: ${await page.evaluate(() => JSON.stringify((currentReport.cross_diag && currentReport.cross_diag.items || []).map((x) => [x.label, x.status, String(x.detail).slice(0, 120)])))}`);
              if (errs.length) n(`[${nm}] 화면 오류: ${[...new Set(errs)].slice(0, 5).join(' | ')}`);
            } catch (e) { n(`[${nm}] 실행 실패 ${e.message}`); }
            await page.close();
          }
          await b.close();
          JS
          node d.mjs
