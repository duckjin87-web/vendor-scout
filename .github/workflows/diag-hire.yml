name: Diagnose hiring collection

# 채용공고 수집 품질 점검 — 배포 사이트의 hiringTrace를 돌려 사이트 분포·날짜 확보율·직종·같은 공고 중복 게시를 본다.
# 함께 채용 사이트의 '지난 공고' 목록 페이지가 프록시 fetchPage로 열리는지 시험한다. 커밋 없음.
on:
  workflow_dispatch:
    inputs:
      site: { description: '사이트 주소', required: true, type: string, default: 'https://vendor-scout-gilt.vercel.app' }
      names: { description: '상호(| 구분)', required: true, type: string, default: '한국콜마|에바스코스메틱|코스맥스' }

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Check
        env:
          SITE: ${{ inputs.site }}
          NAMES: ${{ inputs.names }}
        run: |
          npm i -s playwright@1.56.1 2>&1 | tail -2
          npx -y playwright@1.56.1 install --with-deps chromium 2>&1 | tail -1
          cat > d.mjs <<'JS'
          import { chromium } from 'playwright';
          const n = (t) => console.log('::notice::' + String(t).replace(/\r?\n/g, ' ').slice(0, 3800));
          const b = await chromium.launch();
          const page = await b.newPage();
          page.on('pageerror', (e) => n('pageerror ' + e.message));
          await page.goto(process.env.SITE.replace(/\/$/, '') + '/');
          await page.evaluate((s) => { localStorage.clear(); localStorage.setItem('vs_proxy', s.replace(/\/$/, '') + '/api/proxy'); }, process.env.SITE);
          await page.reload(); await page.waitForTimeout(2500);
          n('build ' + await page.evaluate(() => BUILD));
          for (const nm of process.env.NAMES.split('|')) {
            const r = await page.evaluate(async (q) => {
              const t0 = Date.now();
              const h = await hiringTrace(q).catch((e) => ({ err: e.message }));
              if (!h || h.err) return { err: h && h.err };
              const host = {}; h.posts.forEach((p) => { const k = p.host.replace(/^www\.|^m\./, ''); host[k] = (host[k] || 0) + 1; });
              const dated = h.posts.filter((p) => p.dates.length).length;
              const role = {}; h.posts.forEach((p) => { role[p.role] = (role[p.role] || 0) + 1; });
              const A = analyzeHiring(h.posts, h.heads, 0, null, h.extDiag, h.extProfile, h.hpHints, h.workAddrs);
              const D = A.depts || {};
              let ui = ''; try { const box = renderHiring({ ...A, affil: h.affil }); const t = box.querySelector('.hire-dept'); ui = `표 ${t ? t.querySelectorAll('tbody tr').length + '행' : '없음'} :: ${(box.textContent || '').replace(/\s+/g, ' ').slice(0, 900)}`; } catch (e) { ui = '렌더 오류 ' + e.message; }
              const dep = (D.dept || []).map((d) => `${d.dept}:${d.own}${d.ext ? `+협${d.ext}` : ''}/최근 ${d.lastYm || '-'}/간격 ${d.med ?? '-'}/${d.status.map((x) => x[1]).join(',') || '단발'}`).join(' ; ');
              const rep = (D.repeats || []).map((r) => `${r.dept}|${r.lvl}|${r.emp} ${r.times}회 ${r.avgGap}개월 ${r.yms.join('>')}`).join(' ; ');
              return { ms: Date.now() - t0, n: h.posts.length, raw: h.rawPostN, board: h.boardN, dated, host, role, affil: h.affil,
                dept: `채용 ${D.ownOpenings}건(+협력사 ${D.extOpenings}) · 날짜 ${D.dated}(추정 ${D.est}) · 제외 ${D.notJob} :: ${dep}`, rep, find: (D.findings || []).map((f) => f.t).join(' / '),
                sig: (A.signals || []).map((x) => `[${x.level}] ${x.title}`).join(' / '), ui,
                diag: (h.extDiag || []).map((x) => `${x.host}/${x.kind}:${x.ok ? x.found : x.why}`).slice(0, 14),
                posts: h.posts.map((p) => `${(p.dates[0] || '----')}${p.board && p.board.ymEst ? '~' : ''}|${(p.board && p.board.site) || p.host}|${p.board && p.board.belong === 'partner' ? '협력사|' : ''}${p.board && p.board.status ? p.board.status + '|' : ''}${p.title.slice(0, 60)}|${p.desc.slice(0, 80)}`) };
            }, nm);
            if (r.err) { n(`[${nm}] 실패 ${r.err}`); continue; }
            n(`[${nm}] ${r.ms}ms · 공고 ${r.n}건(목록 ${r.board} · 검색 원본 ${r.raw}) · 날짜 확보 ${r.dated}건 · 사이트 ${JSON.stringify(r.host)} · 직종 ${JSON.stringify(r.role)} · 계열 제외 ${(r.affil || []).join(',')}`);
            n(`[${nm} 페이지] ${r.diag.join(' ‖ ')}`);
            if (process.env.POSTS === '1') for (let i = 0; i < r.posts.length; i += 6) n(`[${nm} 공고 ${i + 1}~] ${r.posts.slice(i, i + 6).join(' ‖ ')}`);
            n(`[${nm} 부서] ${r.dept}`); n(`[${nm} 직책 반복] ${r.rep || '-'}`); n(`[${nm} 해석] ${r.find || '-'} ‖ 신호 ${r.sig || '-'}`); n(`[${nm} 화면] ${r.ui}`);
          }
          await b.close();
          JS
          node d.mjs
