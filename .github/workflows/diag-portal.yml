name: Diagnose data.go.kr catalog

# 공공데이터포털에서 키워드로 오픈API를 찾고, 상세 페이지의 제목·기관·요청주소·승인방식을 뽑는다. 커밋 없음.
on:
  workflow_dispatch:
    inputs:
      keywords:
        description: '검색어(쉼표 구분)'
        required: true
        type: string
      ids:
        description: '상세를 볼 데이터 번호(쉼표 구분, 선택)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Search
        env:
          KW: ${{ inputs.keywords }}
          IDS: ${{ inputs.ids }}
        run: |
          cat > d.mjs <<'JS'
          const n = (t) => console.log('::notice::' + String(t).replace(/\r?\n/g, ' ').slice(0, 1800));
          const UA = { 'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36' };
          const txt = (h) => String(h || '').replace(/<script[\s\S]*?<\/script>/gi, ' ').replace(/<[^>]+>/g, ' ').replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&').replace(/\s+/g, ' ').trim();
          const ids = new Set((process.env.IDS || '').split(',').map((s) => s.trim()).filter(Boolean));
          for (const kw of process.env.KW.split(',').map((s) => s.trim()).filter(Boolean)) {
            try {
              const u = `https://www.data.go.kr/tcs/dss/selectDataSetList.do?dType=API&keyword=${encodeURIComponent(kw)}&perPage=10&currentPage=1`;
              const h = await (await fetch(u, { headers: UA })).text();
              // 결과 항목: /data/{id}/openapi.do 링크와 제목
              const items = [...h.matchAll(/href="\/data\/(\d+)\/openapi\.do"[^>]*>([\s\S]*?)<\/a>/g)].map((m) => [m[1], txt(m[2])]).filter(([, t]) => t);
              const uniq = [...new Map(items.map((x) => [x[0], x])).values()].slice(0, 8);
              uniq.slice(0, 4).forEach(([id]) => ids.add(id));
              n(`[검색] ${kw} → ${uniq.map(([id, t]) => `${id}:${t.slice(0, 50)}`).join(' | ') || '결과 없음'}`);
            } catch (e) { n(`[검색] ${kw} 실패 ${e.message}`); }
          }
          for (const id of ids) {
            try {
              const h = await (await fetch(`https://www.data.go.kr/data/${id}/openapi.do`, { headers: UA })).text();
              const T = txt(h);
              const title = (h.match(/<title>([^<]*)<\/title>/) || [])[1] || '';
              const pick = (re) => (T.match(re) || [])[1] || '';
              const ep = [...new Set([...h.matchAll(/https?:\/\/apis\.data\.go\.kr\/[A-Za-z0-9_\/.\-]+/g)].map((m) => m[0]))].slice(0, 4).join(' ');
              n(`[상세 ${id}] ${title.trim().slice(0, 70)} · 기관 ${pick(/제공기관\s*([^\s]+(?:\s[^\s]+)?)/).slice(0, 30)} · 심의 ${pick(/심의여부\s*(\S+)/)} · 갱신 ${pick(/업데이트 주기\s*(\S+)/)} · EP ${ep || '(없음)'} · 키워드 ${pick(/키워드\s*([^\n]{0,60})/).slice(0, 60)}`);
              // 응답 항목명 일부
              const fields = [...new Set([...h.matchAll(/<td[^>]*>\s*([A-Za-z][A-Za-z0-9_]{2,30})\s*<\/td>\s*<td[^>]*>\s*([^<]{1,30})<\/td>/g)].map((m) => `${m[1]}(${m[2].trim()})`))].slice(0, 30);
              if (fields.length) n(`[항목 ${id}] ${fields.join(', ')}`);
            } catch (e) { n(`[상세 ${id}] 실패 ${e.message}`); }
          }
          JS
          node d.mjs
