name: Diagnose NPS history depth

# 국민연금 사업장 API가 과거 달 자료를 주는지 확인한다(3개월 추이·작년 동월 비교 가능 여부).
# 결과는 주석으로만 남기고 아무것도 커밋하지 않는다.

on:
  workflow_dispatch:
    inputs:
      vendor_name:
        description: '사업장명 (예: 오드컬러)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        env:
          KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
          NAME: ${{ inputs.vendor_name }}
        run: |
          cat > h.mjs <<'JS'
          const note = (t) => console.log(`::notice::${String(t).replace(/%/g, '%25').replace(/\r?\n/g, ' ').slice(0, 5000)}`);
          const NPS = 'https://apis.data.go.kr/B552015/NpsBplcInfoInqireServiceV2';
          const q = (o) => new URLSearchParams({ serviceKey: process.env.KEY, dataType: 'json', pageNo: '1', numOfRows: '100', ...o });
          const items = async (op, o) => { const t = await (await fetch(`${NPS}/${op}?${q(o)}`)).text(); try { const j = JSON.parse(t); const b = j.response.body; let it = b.items && b.items.item; it = Array.isArray(it) ? it : (it ? [it] : []); return { total: b.totalCount, it }; } catch { return { total: null, it: [], raw: t.slice(0, 300) }; } };
          const a = await items('getBassInfoSearchV2', { wkplNm: process.env.NAME });
          const yms = {}; a.it.forEach((x) => { yms[x.dataCrtYm] = (yms[x.dataCrtYm] || 0) + 1; });
          note(`기본 검색 ${a.total}건 · 기준월 분포 ${JSON.stringify(yms)} · 예 ${JSON.stringify(a.it.slice(0, 3)).slice(0, 900)}`);
          const tries = [];
          for (const ym of ['202607', '202605', '202508']) {
            for (const k of ['dataCrtYm', 'data_crt_ym']) {
              const r = await items('getBassInfoSearchV2', { wkplNm: process.env.NAME, [k]: ym });
              tries.push(`${k}=${ym}: ${r.total}건 기준월 ${[...new Set(r.it.map((x) => x.dataCrtYm))].join(',')}${r.raw ? ' 원문 ' + r.raw : ''}`);
            }
          }
          note(`기준월 지정 검색: ${tries.join(' ; ')}`);
          const seq = a.it[0] && a.it[0].seq;
          if (seq) {
            const out = [];
            for (const ym of ['202607', '202605', '202508']) {
              const d = await items('getDetailInfoSearchV2', { seq, dataCrtYm: ym });
              const p = await items('getPdAcctoSttusInfoSearchV2', { seq, dataCrtYm: ym });
              out.push(`${ym} 상세 ${JSON.stringify(d.it[0] || d.raw || null).slice(0, 220)} / 기간별 ${JSON.stringify(p.it[0] || p.raw || null).slice(0, 160)}`);
            }
            note(`seq ${seq} 과거 달: ${out.join(' ; ')}`);
          }
          JS
          node h.mjs
