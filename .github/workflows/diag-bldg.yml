name: Diagnose all-building footprints (NED WFS)

# 한국콜마 세종 필지의 '모든 건물' 윤곽을 GIS건물통합정보 WFS로 받을 수 있는지 본다(LT_C_SPBD는 주소 붙은 동만). 커밋 없음.
on:
  workflow_dispatch:
    inputs:
      site: { description: '사이트 주소', required: true, type: string, default: 'https://vendor-scout-gilt.vercel.app' }
      addr: { description: '주소', required: true, type: string, default: '세종특별자치시 전의면 산단길 22-17' }

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Probe
        env:
          SITE: ${{ inputs.site }}
          ADDR: ${{ inputs.addr }}
        run: |
          cat > d.mjs <<'JS'
          const n = (t) => console.log('::notice::' + String(t).replace(/\r?\n/g, ' ').slice(0, 2400));
          const vw = async (p) => { const r = await fetch(`${process.env.SITE}/api/proxy?service=vworld&${new URLSearchParams(p)}`, { signal: AbortSignal.timeout(28000) }); const t = await r.text(); try { return JSON.parse(t); } catch { return { raw: t.slice(0, 400), status: r.status }; } };
          const feats = (j) => (j && j.response && j.response.result && j.response.result.featureCollection && j.response.result.featureCollection.features) || [];
          const g = await vw({ op: 'address', request: 'getcoord', type: 'road', address: process.env.ADDR, refine: 'true', simple: 'false' });
          const pt = g.response && g.response.result && g.response.result.point;
          n(`좌표 ${pt ? `${pt.x},${pt.y}` : JSON.stringify(g).slice(0, 300)}`);
          const pj = await vw({ op: 'data', data: 'LP_PA_CBND_BUBUN', geomFilter: `POINT(${pt.x} ${pt.y})`, size: '1', geometry: 'true', attribute: 'true', crs: 'EPSG:4326' });
          const pf = feats(pj)[0];
          const ring = pf.geometry.type === 'MultiPolygon' ? pf.geometry.coordinates[0][0] : pf.geometry.coordinates[0];
          const xs = ring.map((p) => p[0]), ys = ring.map((p) => p[1]);
          const [x0, x1, y0, y1] = [Math.min(...xs), Math.max(...xs), Math.min(...ys), Math.max(...ys)];
          n(`필지 ${pf.properties.pnu} ${pf.properties.addr} bbox ${x0},${y0},${x1},${y1}`);
          const show = (tag, j) => {
            const fs = (j && j.features) || [];
            n(`${tag}: ${fs.length ? `${fs.length}건` : JSON.stringify(j).slice(0, 500)}`);
            fs.slice(0, 12).forEach((f, i) => n(`${tag} #${i} geom=${f.geometry && f.geometry.type} props=${JSON.stringify(f.properties).slice(0, 700)}`));
          };
          const ctr = (f) => { const r = f.geometry.coordinates[0][0]; const xs = r.map((p) => p[0]), ys = r.map((p) => p[1]); return [(Math.min(...xs) + Math.max(...xs)) / 2, (Math.min(...ys) + Math.max(...ys)) / 2].map((v) => v.toFixed(5)).join(','); };
          const py = (m) => Math.round(m / 3.305785);
          const tests = [
            ['yx 4326', { bbox: `${y0},${x0},${y1},${x1}`, srsName: 'EPSG:4326' }],
            ['xy 4326', { bbox: `${x0},${y0},${x1},${y1}`, srsName: 'EPSG:4326' }],
            ['xy +crs', { bbox: `${x0},${y0},${x1},${y1},EPSG:4326`, srsName: 'EPSG:4326' }],
            ['yx +crs', { bbox: `${y0},${x0},${y1},${x1},EPSG:4326`, srsName: 'EPSG:4326' }],
            ['xy no-srs', { bbox: `${x0},${y0},${x1},${y1}` }],
            ['tiny yx', { bbox: `${(y0 + y1) / 2 - 0.0003},${(x0 + x1) / 2 - 0.0003},${(y0 + y1) / 2 + 0.0003},${(x0 + x1) / 2 + 0.0003}`, srsName: 'EPSG:4326' }],
            ['far yx(서울)', { bbox: '37.56,126.97,37.57,126.98', srsName: 'EPSG:4326' }],
            ['pnu', { pnu: pf.properties.pnu }],
            ['pnu733', { pnu: '3611037027107330000' }],
          ];
          for (const [lab, p] of tests) {
            const j = await vw({ op: 'bldg', fn: 'getBldgisSpceWFS', typename: 'dt_d010', maxFeatures: '100', ...p });
            const fs = j.features || [];
            n(`${lab}: ${fs.length}건 ${fs.length ? '' : JSON.stringify(j).slice(0, 300)} :: ` + fs.slice(0, 14).map((f) => `${f.properties.pnu.slice(10, 19)}/${py(f.properties.ar)}평/${f.properties.ground_floor_co}층@${ctr(f)}`).join(' · '));
          }
          JS
          node d.mjs
