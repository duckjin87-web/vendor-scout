name: Diagnose growth data sources

# 급성장 업체 판별에 쓸 1순위 공공데이터가 실제로 무엇을 주는지 확인하는 진단용 워크플로우.
#   ① 국민연금 사업장 API — 기본·상세·기간별 현황(월별 취득·상실)
#   ② 국민연금 가입 사업장 내역 파일(공공데이터포털 파일데이터) — 내려받기 경로·열 이름·업종 열
#   ③ 국토부 건축HUB 건축인허가 — 지번으로 인허가(증축·신축) 조회
# 결과는 주석(annotation)으로 남긴다. 아무것도 커밋하지 않는다.

on:
  workflow_dispatch:
    inputs:
      vendor_name:
        description: '업체명 (예: 코스맥스)'
        required: true
        type: string
      only_file:
        description: '1이면 국민연금 파일만 확인'
        required: false
        type: string

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        env:
          KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
          NAME: ${{ inputs.vendor_name }}
          ONLY_FILE: ${{ inputs.only_file }}
        run: |
          cat > probe.mjs <<'EOF'
          const KEY = process.env.KEY, NAME = process.env.NAME;
          const note = (t) => console.log(`::notice::${String(t).replace(/%/g, '%25').replace(/\r?\n/g, ' ').slice(0, 6000)}`);
          const get = async (u, init) => { try { const r = await fetch(u, init); return { s: r.status, t: await r.text(), h: r.headers }; } catch (e) { return { s: 0, t: String(e) }; } };
          const itemsOf = (t) => { try { const j = JSON.parse(t); const b = (j.response && j.response.body) || j.body || {}; let it = b.items; if (it && it.item) it = it.item; return { total: b.totalCount, items: Array.isArray(it) ? it : (it ? [it] : []) }; } catch { return { total: null, items: [], raw: t.slice(0, 400) }; } };
          if (process.env.ONLY_FILE !== '1') {
          // ① 국민연금 API
          const NPS = 'https://apis.data.go.kr/B552015/NpsBplcInfoInqireServiceV2';
          const q = (o) => new URLSearchParams({ serviceKey: KEY, dataType: 'json', pageNo: '1', numOfRows: '10', ...o });
          const s1 = await get(`${NPS}/getBassInfoSearchV2?${q({ wkplNm: NAME })}`);
          const b1 = itemsOf(s1.t);
          note(`NPS 기본 HTTP ${s1.s} · ${b1.total}건 · 첫 항목 ${JSON.stringify(b1.items[0] || b1.raw || '').slice(0, 900)}`);
          const seq = b1.items[0] && b1.items[0].seq;
          const ym = b1.items[0] && b1.items[0].dataCrtYm;
          if (seq) {
            const d = await get(`${NPS}/getDetailInfoSearchV2?${q({ seq })}`);
            note(`NPS 상세 HTTP ${d.s} · ${JSON.stringify(itemsOf(d.t).items[0] || d.t.slice(0, 300)).slice(0, 1200)}`);
            for (const extra of [{ seq }, { seq, dataCrtYm: ym }, { seq, data_crt_ym: ym }]) {
              const p = await get(`${NPS}/getPdAcctoSttusInfoSearchV2?${q(extra)}`);
              const pi = itemsOf(p.t);
              note(`NPS 기간별 ${JSON.stringify(extra)} HTTP ${p.s} · ${pi.total}건 · ${JSON.stringify(pi.items.slice(0, 3) || pi.raw).slice(0, 1500)}${pi.items.length ? '' : ' 원문 ' + p.t.slice(0, 300)}`);
              if (pi.items.length) break;
            }
          }
          }
          // ② 국민연금 가입 사업장 내역 파일 — 파일데이터 화면에서 내려받기 경로를 찾는다
          for (const id of ['15083277']) {
            const pg = await get(`https://www.data.go.kr/data/${id}/fileData.do`);
            const title = (pg.t.match(/<title>([\s\S]*?)<\/title>/i) || [])[1] || '';
            const dl = [...new Set([...pg.t.matchAll(/(fileDownload[^"'\s<>]*|atchFileId=[A-Za-z0-9_]+[^"'\s<>]*|fileDetailSn=\d+)/g)].map((m) => m[1]))].slice(0, 8);
            const meta = (pg.t.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').match(/(파일데이터명[\s\S]{0,400})/) || [''])[0];
            note(`파일 ${id} HTTP ${pg.s} · ${title.trim()} · 내려받기 단서 ${dl.join(' | ') || '없음'} · ${meta.slice(0, 500)}`);
            const js = [...pg.t.matchAll(/(publicDataPk|publicDataDetailPk|atchFileId|fileDetailSn)\s*[:=]\s*['"]?([A-Za-z0-9_-]+)/g)].map((m) => `${m[1]}=${m[2]}`);

            const atch = (pg.t.match(/atchFileId['"]?\s*[:=]\s*['"]([A-Za-z0-9_]+)/) || [])[1];
            const sn = (pg.t.match(/fileDetailSn['"]?\s*[:=]\s*['"]?(\d+)/) || [])[1] || '1';
            const pk = (pg.t.match(/publicDataDetailPk['"]?\s*[:=]\s*['"]([A-Za-z0-9_-]+)/) || [])[1];
            const uddis = [...new Set((pg.t.match(/uddi:[0-9a-f-]{20,}/gi) || []))];
            const fnCalls = [...new Set((pg.t.match(/fn_?[A-Za-z]*[Dd]own[A-Za-z]*\([^)]{0,200}\)/g) || []))].slice(0, 5);
            note(`uddi ${uddis.join(', ') || '없음'} · 내려받기 함수 ${fnCalls.join(' | ').slice(0, 600)}`);
            for (const u of uddis.slice(0, 2)) {
              // 공공데이터포털 파일데이터 자동변환 API(odcloud)
              const o = await get(`https://api.odcloud.kr/api/${id}/v1/${u}?page=1&perPage=3&serviceKey=${encodeURIComponent(KEY)}`);
              note(`odcloud ${u} HTTP ${o.s} · ${o.t.slice(0, 1500)}`);
              // 화장품 업종으로 거르기 시도
              const o2 = { s: 0, t: '(생략)' }; if (false) await get(`https://api.odcloud.kr/api/${id}/v1/${u}?page=1&perPage=5&serviceKey=${encodeURIComponent(KEY)}&${encodeURIComponent('cond[사업장업종코드명::LIKE]')}=${encodeURIComponent('화장품')}`);
              note(`odcloud 화장품 거르기 HTTP ${o2.s} · ${o2.t.slice(0, 1500)}`);
              // 전체 파일 내려받기 시도(앞부분만)
              const r3 = await fetch(`https://www.data.go.kr/tcs/dss/selectFileDataDownload.do?publicDataPk=${id}&publicDataDetailPk=${u}&fileDetailSn=1`, { headers: { Range: 'bytes=0-200000', 'User-Agent': 'Mozilla/5.0', Referer: `https://www.data.go.kr/data/${id}/fileData.do` } }).catch((e) => ({ status: 0, e }));
              if (r3.status) {
                const t3 = await r3.text();
                let j3 = null; try { j3 = JSON.parse(t3); } catch {}
                const flat = []; const walk = (o, pre) => { if (!o || typeof o !== 'object') return; for (const [k, v] of Object.entries(o)) { if (v && typeof v === 'object') walk(v, `${pre}${k}.`); else if (v !== '' && v != null && /atch|file|url|path|nm|sn|size|ext|down/i.test(k)) flat.push(`${pre}${k}=${String(v).slice(0, 120)}`); } };
                walk(j3, '');
                note(`내려받기 메타 HTTP ${r3.status} · ${flat.slice(0, 40).join(' ; ').slice(0, 2500)}`);
                // 메타에 실제 파일 경로가 있으면 앞부분을 받아 열 이름을 본다
                const fu = flat.map((x) => x.split('=').slice(1).join('=')).find((v) => /^https?:\/\//.test(v) && /(csv|zip|download|file)/i.test(v));
                const atch2 = (flat.find((x) => /atchFileId=FILE_/.test(x)) || '').split('=')[1];
                const sn3 = (flat.find((x) => /fileDetailSn=\d/.test(x)) || '=1').split('=')[1];
                for (const u3 of [fu, atch2 && `https://www.data.go.kr/cmm/cmm/fileDownload.do?atchFileId=${atch2}&fileDetailSn=${sn3}&insertDataPrcus=N`].filter(Boolean)) {
                  const r4 = await fetch(u3, { headers: { Range: 'bytes=0-3000000', 'User-Agent': 'Mozilla/5.0' } }).catch(() => null);
                  if (!r4) continue;
                  const b4 = new Uint8Array(await r4.arrayBuffer());
                  const t4 = /[가-힣]/.test(new TextDecoder('utf-8').decode(b4.slice(0, 3000))) ? new TextDecoder('utf-8').decode(b4) : new TextDecoder('euc-kr').decode(b4);
                  const ls = t4.split(/\r?\n/); const cos = ls.filter((l) => /화장품/.test(l));
                  note(`실제 파일 ${u3.slice(0, 140)} HTTP ${r4.status} · ${r4.headers.get('content-disposition') || ''} · ${r4.headers.get('content-range') || r4.headers.get('content-length')} · 첫 줄 ${ls[0].slice(0, 700)} · 둘째 ${String(ls[1] || '').slice(0, 300)} · 앞 3MB ${ls.length}줄 중 화장품 ${cos.length}줄 예 ${cos.slice(0, 2).join(' || ').slice(0, 700)}`);
                  break;
                }
              }
            }
            const linkRaw = (pg.t.match(/([^"'\s<>]*fileDownload\.do\?atchFileId=[^"'\s<>]+)/) || [])[1] || '';
            const link = linkRaw ? new URL(linkRaw.replace(/&amp;/g, '&'), 'https://www.data.go.kr/').href : '';
            for (const u of []) {
              let r;
              try {
                const ctrl = new AbortController(); const tm = setTimeout(() => ctrl.abort(), 60000);
                r = await fetch(u, { headers: { Range: 'bytes=0-4000000', 'User-Agent': 'Mozilla/5.0', Referer: `https://www.data.go.kr/data/${id}/fileData.do` }, signal: ctrl.signal });
                clearTimeout(tm);
              } catch (e) { note(`내려받기 실패 ${u} — ${e && e.message}`); continue; }
              if (!r.ok && r.status !== 206) { note(`내려받기 HTTP ${r.status} ${u} · ${(await r.text()).slice(0, 300)}`); continue; }
              const buf = new Uint8Array(await r.arrayBuffer());
              const dec = (enc) => { try { return new TextDecoder(enc).decode(buf); } catch { return ''; } };
              const txt = /[가-힣]/.test(dec('utf-8')) ? dec('utf-8') : dec('euc-kr');
              const lines = txt.split(/\r?\n/);
              const cos = lines.filter((l) => /화장품/.test(l));
              const codes = {}; lines.forEach((l) => { const m = l.match(/화장품[^,"]*/); if (m) codes[m[0]] = (codes[m[0]] || 0) + 1; });
              note(`앞 4MB ${lines.length}줄 중 '화장품' 포함 ${cos.length}줄 · 표기별 ${JSON.stringify(codes).slice(0, 400)} · 예 ${cos.slice(0, 2).join(' || ').slice(0, 900)}`);
              note(`내려받기 ${u.slice(0, 120)} HTTP ${r.status} · 형식 ${r.headers.get('content-type')} · 크기 ${r.headers.get('content-range') || r.headers.get('content-length')} · 첫 줄 ${lines[0].slice(0, 700)}`);
              note(`둘째 줄 ${String(lines[1] || '').slice(0, 900)}`);
              break;
            }
          }
          if (process.env.ONLY_FILE !== '1') {
          // ③ 건축HUB 건축인허가 — 한국콜마 기준점 지번(세종 전의면 755)으로
          const loc = { sigunguCd: '36110', bjdongCd: '34025', platGbCd: '0', bun: '0755', ji: '0000' };
          for (const base of ['https://apis.data.go.kr/1613000/ArchPmsHubService', 'https://apis.data.go.kr/1613000/ArchPmsService_V2']) {
            for (const op of ['getApBasisOulnInfo', 'getApDongOulnInfo']) {
              const r = await get(`${base}/${op}?${new URLSearchParams({ serviceKey: KEY, _type: 'json', numOfRows: '20', pageNo: '1', ...loc })}`);
              const it = itemsOf(r.t);
              note(`인허가 ${base.split('/').pop()}/${op} HTTP ${r.s} · ${it.total}건 · ${JSON.stringify(it.items.slice(0, 2)).slice(0, 1500)}${it.items.length ? '' : ' 원문 ' + r.t.slice(0, 300)}`);
            }
          }
          }
          EOF
          node probe.mjs
