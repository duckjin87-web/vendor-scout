name: Build growth signals (NPS monthly)

# 급성장 신호 — 국민연금 가입 사업장 월간 파일 + 식약처 제조업 명단으로 화장품 제조업체의 월 순증을 집계해
# data/growth/latest.json(대시보드용)과 달별 스냅숏을 저장한다. 키는 Secret에만 있고 결과 JSON만 커밋된다.

# 자동 실행은 하지 않는다 — 대시보드의 「최신 자료 조회 요청」 버튼(프록시 growthRefresh)이나
# GitHub Actions 화면의 Run workflow로만 돈다. 포털 파일이 지난번과 같으면 바로 끝난다.
on:
  workflow_dispatch:
    inputs:
      force:
        description: '1이면 같은 달이어도 다시 집계'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: growth
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
          FORCE: ${{ inputs.force }}
        run: node scripts/build-growth.mjs
      # 채용공고 급등(사람인·고용24 공식 API) — 키가 없으면 사유만 남기고 넘어간다. 국민연금 집계와 따로 실패해도 된다.
      - name: Jobs
        continue-on-error: true
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
          SARAMIN_KEY: ${{ secrets.SARAMIN_KEY }}
          WORK24_KEY: ${{ secrets.WORK24_KEY }}
        run: node scripts/build-jobs.mjs
      # 화장품 제조업 명단 누적 비교(매주 자동으로도 돈다 — makers.yml). 실패해도 다른 집계는 커밋한다.
      - name: Makers
        continue-on-error: true
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
        run: node scripts/build-makers.mjs
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/growth)" ]; then
            git add data/growth
            git commit -m "growth: 국민연금·채용공고·제조업 명단 집계 갱신 ($(date -u +%F))"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "변경 없음 — 커밋 생략"
          fi
