name: Build growth signals (NPS monthly)

# 급성장 신호 — 국민연금 가입 사업장 월간 파일 + 식약처 제조업 명단으로 화장품 제조업체의 월 순증을 집계해
# data/growth/latest.json(대시보드용)과 달별 스냅숏을 저장한다. 키는 Secret에만 있고 결과 JSON만 커밋된다.
# 공공데이터포털 등록 예정일이 매달 26일 무렵이라 27일과 다음 달 1일에 돈다(같은 달이면 변경 없음 → 커밋 생략).

on:
  schedule:
    - cron: '23 1 27 * *'
    - cron: '23 1 1 * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: growth
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
        run: node scripts/build-growth.mjs
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/growth)" ]; then
            git add data/growth
            git commit -m "growth: 국민연금 월간 집계 갱신 ($(date -u +%F))"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "변경 없음 — 커밋 생략"
          fi
