name: Diagnose NPS workplace file (cosmetics)

# 국민연금 가입 사업장 내역 파일(전국, 월간)을 내려받아 화장품 업종 사업장이 몇 곳인지,
# 업종 코드·이름이 무엇인지, 그리고 기간별 현황 API로 지난달·지지난달 값을 받을 수 있는지 확인한다.
# 결과는 주석으로만 남기고 아무것도 커밋하지 않는다.

on:
  workflow_dispatch:
    inputs:
      hist:
        description: '1이면 이전 달 파일 이력만 확인'
        required: false
        type: string

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        env:
          KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
          HIST: ${{ inputs.hist }}
        run: |
          cat > p.mjs <<'JS'
          const main = async () => {
          const note = (t) => console.log(`::notice::${String(t).replace(/%/g, '%25').replace(/\r?\n/g, ' ').slice(0, 6000)}`);
          const pg = await (await fetch('https://www.data.go.kr/data/15083277/fileData.do')).text();
          const uddi = (pg.match(/uddi:[0-9a-f-]{20,}/i) || [])[0];
          const meta = await (await fetch(`https://www.data.go.kr/tcs/dss/selectFileDataDownload.do?publicDataPk=15083277&publicDataDetailPk=${uddi}&fileDetailSn=1`, { headers: { Referer: 'https://www.data.go.kr/data/15083277/fileData.do' } })).text();
          const atch = (meta.match(/"atchFileId"\s*:\s*"(FILE_[0-9]+)"/) || [])[1];
          if (process.env.HIST === '1') {
            // 이전 달 파일이 남아 있는지 — 메타의 이력·파일 목록과 화면의 다른 FILE_ 번호
            const ids = [...new Set((meta + pg).match(/FILE_[0-9]{9,}/g) || [])];
            const hk = [...new Set((meta.match(/"[A-Za-z]*(?:[Hh]ist|[Vv]er|[Bb]efore|[Pp]rev|[Ll]ist)[A-Za-z]*"\s*:/g) || []))];
            note(`FILE_ 번호들 ${ids.join(', ')} · 이력 관련 키 ${hk.join(' ')} · 메타 길이 ${meta.length}`);
            const hist = [...pg.matchAll(/(\d{8})[^<]{0,40}(?:csv|CSV)/g)].map((m) => m[1]);
            note(`화면의 날짜+csv 표기 ${[...new Set(hist)].join(', ')} · 이력 링크 ${[...new Set((pg.match(/[^"'\s<>]*(?:hist|History|Hist)[^"'\s<>]*/g) || []))].slice(0, 8).join(' | ')}`);
            const hv = (k) => { const out = []; let i = 0; while ((i = meta.indexOf(`"${k}"`, i)) >= 0) { out.push(meta.slice(i + k.length + 3, i + k.length + 40).split(/[,}]/)[0]); i += k.length; } return [...new Set(out)].join(' '); };
            note(`이력 값: ${hv('publicDataHistSn')} | ${hv('prePublicDataHistSn')} | ${hv('beforeDetailPk')} | ${hv('publicHistDataAt')}`);
            const at = pg.indexOf('histAndCsvData');
            const jsUrls = [];
            for (const src of [...pg.matchAll(/<script[^>]*src=["']([^"']+)["']/g)].map((m) => m[1]).filter((u) => /file|dss|data/i.test(u)).slice(0, 6)) {
              const js = await (await fetch(new URL(src, 'https://www.data.go.kr/').href)).text().catch(() => '');
              const i = js.indexOf('histAndCsvData');
              if (i >= 0) jsUrls.push(`${src}: ${js.slice(Math.max(0, i - 200), i + 900).replace(/\s+/g, ' ')}`);
            }
            note(`화면 내 histAndCsvData 주변: ${at >= 0 ? pg.slice(Math.max(0, at - 300), at + 600).replace(/\s+/g, ' ') : '없음'}`);
            note(`스크립트 내 정의: ${jsUrls.join(' || ').slice(0, 5000) || '못 찾음'}`);
            return;
            for (const sn2 of ['2', '3']) {
              const m2 = await (await fetch(`https://www.data.go.kr/tcs/dss/selectFileDataDownload.do?publicDataPk=15083277&publicDataDetailPk=${uddi}&fileDetailSn=${sn2}`, { headers: { Referer: 'https://www.data.go.kr/data/15083277/fileData.do' } })).text();
              note(`fileDetailSn=${sn2} 메타: ${(m2.match(/"(atchFileId|fileNm|orginlFileNm|dataNm|fileDetailSn)"\s*:\s*"?[^",}]*/g) || []).join(' ; ').slice(0, 800)}`);
            }
            return;
          }
          const sn = (meta.match(/"fileDetailSn"\s*:\s*"?(\d+)/) || [])[1] || '1';
          const r = await fetch(`https://www.data.go.kr/cmm/cmm/fileDownload.do?atchFileId=${atch}&fileDetailSn=${sn}&insertDataPrcus=N`);
          const buf = new Uint8Array(await r.arrayBuffer());
          const txt = new TextDecoder('euc-kr').decode(buf);
          const lines = txt.split(/\r?\n/).filter(Boolean);
          const head = lines[0].split(',');
          const iNm = head.findIndex((h) => /업종코드명/.test(h)), iCd = head.findIndex((h) => /업종코드$|업종코드\s*$/.test(h) || (/업종코드/.test(h) && !/명/.test(h)));
          note(`파일 ${atch} ${buf.length}바이트 · ${lines.length - 1}행 · 열 ${head.join(' | ')}`);
          const parse = (l) => { const out = []; let cur = '', q = false; for (const ch of l) { if (ch === '"') q = !q; else if (ch === ',' && !q) { out.push(cur); cur = ''; } else cur += ch; } out.push(cur); return out; };
          const rows = lines.slice(1).map(parse);
          const byNm = {}; rows.forEach((c) => { const n = c[iNm] || ''; if (/화장품|화장|코스메틱/.test(n)) byNm[`${c[iCd]} ${n}`] = (byNm[`${c[iCd]} ${n}`] || 0) + 1; });
          note(`화장품 관련 업종 코드·이름별 사업장 수: ${JSON.stringify(byNm)}`);
          const cos = rows.filter((c) => /화장품/.test(c[iNm] || ''));
          const idx = (re) => head.findIndex((h) => re.test(h));
          const iN = idx(/사업장명/), iCnt = idx(/가입자수/), iNew = idx(/신규취득/), iLost = idx(/상실/), iAmt = idx(/고지금액/), iSt = idx(/가입상태/), iYm = idx(/생성년월/);
          const act = cos.filter((c) => c[iSt] === '1');
          const withNet = act.map((c) => ({ nm: c[iN], cnt: +c[iCnt], net: (+c[iNew]) - (+c[iLost]), nw: +c[iNew], ls: +c[iLost] }));
          const top = withNet.filter((x) => x.cnt - x.net > 0).map((x) => ({ ...x, pct: Math.round(x.net / (x.cnt - x.net) * 1000) / 10 })).sort((a, b) => b.net - a.net).slice(0, 12);
          note(`기준월 ${rows[0][iYm]} · 화장품 업종 ${cos.length}곳(가입 중 ${act.length}) · 이번 달 순증 상위: ${top.map((x) => `${x.nm} ${x.cnt}명(${x.net >= 0 ? '+' : ''}${x.net}, +${x.nw}/-${x.ls}, ${x.pct}%)`).join(' ; ')}`);
          note(`예시 행: ${cos.slice(0, 2).map((c) => c.join(',')).join(' || ').slice(0, 1200)}`);
          // 기간별 현황 API로 지난달 값을 받을 수 있는지 — 순증 1위 사업장으로
          const NPS = 'https://apis.data.go.kr/B552015/NpsBplcInfoInqireServiceV2';
          const q = (o) => new URLSearchParams({ serviceKey: process.env.KEY, dataType: 'json', pageNo: '1', numOfRows: '10', ...o });
          const name = top[0] && top[0].nm;
          if (name) {
            const s = await (await fetch(`${NPS}/getBassInfoSearchV2?${q({ wkplNm: name })}`)).json().catch(() => null);
            const it = s && s.response && s.response.body && s.response.body.items && s.response.body.items.item;
            const first = Array.isArray(it) ? it[0] : it;
            const out = [];
            for (const ym of ['202608', '202607', '202606']) {
              const p = await (await fetch(`${NPS}/getPdAcctoSttusInfoSearchV2?${q({ seq: first.seq, dataCrtYm: ym })}`)).text();
              out.push(`${ym}: ${p.slice(0, 220)}`);
            }
            note(`기간별 현황(${name}, seq ${first && first.seq}, 검색 기준월 ${first && first.dataCrtYm}) → ${out.join(' ; ')}`);
          }
          };
          await main();
          JS
          node p.mjs
