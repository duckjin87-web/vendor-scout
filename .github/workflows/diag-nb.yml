name: Diagnose nearby list coverage

# 근처 업체 목록이 식약처 명단을 얼마나 받는지, 특정 업체가 그 안에 드는지 확인한다. 커밋 없음.
on:
  workflow_dispatch:
    inputs:
      names:
        description: '확인할 업체명(쉼표 구분)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Probe
        env:
          KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
          NAMES: ${{ inputs.names }}
        run: |
          cat > d.mjs <<'JS'
          const n = (t) => console.log('::notice::' + String(t).replace(/\r?\n/g, ' ').slice(0, 900));
          const BASE = 'https://apis.data.go.kr/1471000/CsmtcsMfcrtrInfoService01/getCsmtcsMfcrtrInfoList01';
          const nk = (s) => String(s || '').replace(/\(주\)|㈜|주식회사|유한회사|\s/g, '');
          const page = async (p) => {
            const q = new URLSearchParams({ serviceKey: process.env.KEY, type: 'json', pageNo: String(p), numOfRows: '500' });
            const j = await (await fetch(`${BASE}?${q}`)).json();
            const b = j.body || (j.response && j.response.body) || {};
            let it = b.items; if (it && it.item) it = it.item;
            it = Array.isArray(it) ? it : (it ? [it] : []);
            return { total: Number(b.totalCount) || 0, items: it.map((x) => (x && x.item && typeof x.item === 'object' ? x.item : x)) };
          };
          const f = await page(1); const all = [...f.items]; const pages = Math.ceil(f.total / 500);
          for (let p = 2; p <= pages; p += 6) (await Promise.all([p,p+1,p+2,p+3,p+4,p+5].filter(x=>x<=pages).map(x=>page(x).catch(()=>({items:[]}))))).forEach(g=>all.push(...g.items));
          const isMk = (x) => /제조/.test(String(x.INDUTY||'')) && !/판매/.test(String(x.INDUTY||''));
          const mk = all.filter(isMk);
          const first6k = all.slice(0, 6000).filter(isMk);
          n(`전체 레코드 ${all.length}/${f.total} · 제조 ${mk.length}곳 · 앱이 읽는 앞 6,000건 안의 제조 ${first6k.length}곳 (${Math.round(first6k.length / mk.length * 100)}%)`);
          const sggOf = (a) => String(a||'').split(/\s+/).slice(0,2).join(' ');
          for (const q of process.env.NAMES.split(',').map(s=>s.trim()).filter(Boolean)) {
            const hits = mk.filter(x => nk(x.ENTP_NAME).includes(nk(q)));
            for (const h of hits.slice(0,3)) {
              const idx = all.indexOf(h), mi = mk.indexOf(h);
              n(`「${q}」 → ${h.ENTP_NAME} · ${h.FACTORY_ADDR} · 허가 ${h.ENTP_PERMIT_DATE} · 전체 ${idx+1}번째(앞 6,000건 안: ${idx<6000 ? 'O' : 'X ← 목록에서 빠짐'}) · 제조 중 ${mi+1}번째`);
            }
            if (!hits.length) n(`「${q}」 → 제조업 명단에 없음`);
            // 의약품안전나라 번지 주소
            try {
              const url = `https://nedrug.mfds.go.kr/pbp/CCBBA01/getList?searchYn=true&page=1&limit=50&cobCode=V&entpName=${encodeURIComponent(q)}`;
              const html = await (await fetch(url, { headers: { 'User-Agent': 'Mozilla/5.0' } })).text();
              const txt = (h) => String(h||'').replace(/<[^>]+>/g,' ').replace(/&nbsp;/g,' ').replace(/\s+/g,' ').trim();
              const rows = [...html.matchAll(/<tr[^>]*>([\s\S]*?)<\/tr>/gi)].filter(m=>/getItem/.test(m[1]))
                .map(m => [...m[1].matchAll(/<td[^>]*>([\s\S]*?)<\/td>/gi)].map(x=>txt(x[1])));
              n(`「${q}」 의약품안전나라: ${rows.slice(0,3).map(t=>`${t[1]} | ${t[4]}`).join(' // ') || '결과 없음'}`);
            } catch (e) { n(`「${q}」 의약품안전나라 실패 ${e.message}`); }
          }
          JS
          node d.mjs
