name: Diagnose nedrug maker list

# 의약품안전나라 화장품 업체 목록에서 상호별 행(이름·주소)을 본다. 커밋 없음.
on:
  workflow_dispatch:
    inputs:
      names: { description: '상호(쉼표로 구분)', required: true, type: string }

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Probe
        env:
          NAMES: ${{ inputs.names }}
        run: |
          cat > d.mjs <<'JS'
          const n = (t) => console.log('::notice::' + String(t).replace(/\r?\n/g, ' ').slice(0, 3800));
          const txt = (h) => String(h || '').replace(/<[^>]+>/g, ' ').replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&').replace(/\s+/g, ' ').trim();
          for (const name of process.env.NAMES.split(',').map((s) => s.trim()).filter(Boolean)) {
            const nm = name.replace(/\(주\)|㈜|주식회사/g, '').trim();
            const url = `https://nedrug.mfds.go.kr/pbp/CCBBA01/getList?searchYn=true&page=1&limit=50&cobCode=V&entpName=${encodeURIComponent(nm)}`;
            try {
              const r = await fetch(url, { headers: { 'User-Agent': 'Mozilla/5.0 vendor-scout' }, signal: AbortSignal.timeout(30000) });
              const html = await r.text();
              const rows = [...html.matchAll(/<tr[^>]*>([\s\S]*?)<\/tr>/gi)].filter((m) => /getItem/.test(m[1]))
                .map((m) => [...m[1].matchAll(/<td[^>]*>([\s\S]*?)<\/td>/gi)].map((x) => txt(x[1])));
              n(`${name} · HTTP ${r.status} · ${rows.length}행 · ` + rows.slice(0, 4).map((t) => t.join(' / ')).join(' ‖ '));
              const href = (html.match(/href=["']([^"']*getItem[^"']*)["']/i) || [])[1];
              if (href) {
                const d = await (await fetch('https://nedrug.mfds.go.kr' + href.replace(/&amp;/g, '&'), { headers: { 'User-Agent': 'Mozilla/5.0 vendor-scout' }, signal: AbortSignal.timeout(30000) })).text();
                const t = txt(d); const k = t.indexOf('대표');
                n(`${name} 상세 · 대표 주변: ${k >= 0 ? t.slice(Math.max(0, k - 80), k + 120) : '대표 글자 없음'}`);
              }
            } catch (e) { n(`${name} · 오류 ${e.message}`); }
          }
          JS
          node d.mjs
