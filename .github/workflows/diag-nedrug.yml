name: Diagnose nedrug cosmetics maker search

# 의약품안전나라(nedrug)의 화장품 업체 검색 화면 구조를 확인하는 진단용 워크플로우.
# 공개 웹페이지만 읽고, 결과는 주석(annotation)으로 남긴다. 키·커밋 없음.

on:
  workflow_dispatch:
    inputs:
      vendor_name:
        description: '업체명 (예: 코스맥스)'
        required: true
        type: string
      path:
        description: '확인할 경로(비우면 메뉴에서 찾기, 예: /pbp/CCBAC01)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Probe nedrug
        env:
          NAME: ${{ inputs.vendor_name }}
          PATHQ: ${{ inputs.path }}
        run: |
          cat > probe.mjs <<'EOF'
          const H = 'https://nedrug.mfds.go.kr';
          const UA = { 'User-Agent': 'Mozilla/5.0 (vendor-scout diag)', 'Accept-Language': 'ko' };
          const note = (t) => console.log(`::notice::${String(t).replace(/%/g, '%25').replace(/\r?\n/g, ' ').slice(0, 9000)}`);
          const get = async (u) => { try { const r = await fetch(u, { headers: UA, redirect: 'follow' }); return { s: r.status, t: await r.text(), u: r.url }; } catch (e) { return { s: 0, t: String(e) }; } };
          const strip = (h) => h.replace(/<script[\s\S]*?<\/script>|<style[\s\S]*?<\/style>/gi, ' ').replace(/<[^>]+>/g, ' ').replace(/&nbsp;/g, ' ').replace(/\s+/g, ' ').trim();
          const forms = (h) => [...h.matchAll(/<form[^>]*>/gi)].map((m) => m[0]).join(' | ').slice(0, 800);
          const inputs = (h) => [...new Set([...h.matchAll(/<(?:input|select)[^>]*name=["']([^"']+)["'][^>]*>/gi)].map((m) => m[1]))].join(', ');
          // ① 메뉴에서 화장품 업체 관련 링크 찾기
          let paths = [];
          if (process.env.PATHQ) paths = [process.env.PATHQ];
          else {
            const home = await get(`${H}/pbp/CCBDB01`);   // 화장품 메뉴 화면 — 하위 메뉴 링크가 여기 다 있다
            const links = [...home.t.matchAll(/<a[^>]*href=["']([^"']*\/pbp\/[A-Z0-9]+[^"']*)["'][^>]*>([\s\S]*?)<\/a>/gi)].map((m) => ({ href: m[1], text: strip(m[2]) }));
            const hit = links.filter((l) => /화장품/.test(l.text) || /(업체|업소|제조)/.test(l.text));
            note(`메뉴 HTTP ${home.s} · /pbp 링크 ${links.length}개 · 후보: ${hit.slice(0, 40).map((l) => `${l.text}=${l.href}`).join(' ; ')}`);
            paths = [...new Set(hit.filter((l) => /(업체|업소|제조업|책임판매)/.test(l.text)).map((l) => l.href.replace(H, '').split('?')[0]))].slice(0, 8);
            if (!paths.length) paths = ['/pbp/CCBAC01', '/pbp/CCBAC02', '/pbp/CCBAC03', '/pbp/CCBBA01', '/pbp/CCBBB01'];
          }
          // ② 각 화면의 제목·폼·입력 이름, 그리고 업체명으로 검색해 본 결과
          for (const p of paths) {
            const pg = await get(`${H}${p}`);
            const title = (pg.t.match(/<title>([\s\S]*?)<\/title>/i) || [])[1] || '';
            note(`${p} HTTP ${pg.s} · 제목 ${strip(title)} · 폼 ${forms(pg.t)} · 입력 ${inputs(pg.t)}`);
            const act = ((pg.t.match(/<form[^>]*id=["']searchForm["'][^>]*action=["']([^"']+)["']/i) || [])[1]) || p;
            for (const k of ['entpName', 'searchEntpName', 'bsshNm', 'searchBsshNm', 'entpNm', 'searchText']) {
              const r = await get(`${H}${act}?searchYn=true&page=1&limit=10&${k}=${encodeURIComponent(process.env.NAME)}`);
              const txt = strip(r.t);
              const at = txt.indexOf(process.env.NAME);
              if (r.s === 200 && at >= 0 && /총\s*\d+\s*건/.test(txt)) {
                note(`${p}?${k}= → HTTP ${r.s} · ${(txt.match(/총\s*\d+\s*건/) || [''])[0]} · 본문: ${txt.slice(Math.max(0, at - 300), at + 1500)}`);
                const rows = [...r.t.matchAll(/<tr[\s\S]*?<\/tr>/gi)].map((m) => m[0]).filter((x) => x.includes(process.env.NAME)).slice(0, 2);
                rows.forEach((x) => note(`행 원문: ${x.replace(/\s+/g, ' ').slice(0, 1500)}`));
                break;
              }
            }
          }
          EOF
          node probe.mjs
