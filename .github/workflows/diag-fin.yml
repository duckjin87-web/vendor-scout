name: Diagnose finance sources for a non-listed maker

# 재무가 비는 업체의 재무 경로를 하나씩 확인한다 — 금융위 기업정보(상호 변형)·bizwiki·DART 검색(본인·모회사)·금융위 재무. 커밋 없음.
on:
  workflow_dispatch:
    inputs:
      site: { description: '사이트 주소', required: true, type: string, default: 'https://vendor-scout-gilt.vercel.app' }
      name: { description: '상호', required: true, type: string, default: '모나미코스메틱' }
      bzno: { description: '사업자번호', required: true, type: string, default: '5558602822' }
      parent: { description: '모회사(있으면)', required: false, type: string, default: '모나미' }

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Check
        env:
          SITE: ${{ inputs.site }}
          NM: ${{ inputs.name }}
          BZ: ${{ inputs.bzno }}
          PARENT: ${{ inputs.parent }}
        run: |
          npm i -s playwright@1.56.1 2>&1 | tail -2
          npx -y playwright@1.56.1 install --with-deps chromium 2>&1 | tail -1
          cat > d.mjs <<'JS'
          import { chromium } from 'playwright';
          const n = (t) => console.log('::notice::' + String(t).replace(/\r?\n/g, ' ').slice(0, 3500));
          const UA = { 'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36' };
          // ── DART 공시 검색(키 없이 웹 목록) ──
          const dart = async (crp, from = '20220101') => {
            const body = new URLSearchParams({ currentPage: '1', maxResults: '100', maxLinks: '10', sort: 'date', series: 'desc', textCrpNm: crp, startDate: from, endDate: '20261231', finalReport: 'recent' });
            const r = await fetch('https://dart.fss.or.kr/dsab007/detailSearch.ax', { method: 'POST', headers: { ...UA, 'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8', 'X-Requested-With': 'XMLHttpRequest', Referer: 'https://dart.fss.or.kr/dsab007/main.do' }, body });
            const h = await r.text();
            const rows = [...h.matchAll(/<tr[\s\S]*?<\/tr>/g)].map((m) => m[0].replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim()).filter((x) => /\d{4}\.\d{2}\.\d{2}/.test(x));
            const rcp = [...h.matchAll(/rcpNo=(\d{14})/g)].map((m) => m[1]);
            return { status: r.status, len: h.length, rows, rcp };
          };
          // 모회사 정기보고서에서 자회사 이름이 나오는 문단을 뽑는다(종속회사 요약재무·출자·손상·합병)
          const grab = async (rcp, label) => {
            try {
              const m = await (await fetch(`https://dart.fss.or.kr/dsaf001/main.do?rcpNo=${rcp}`, { headers: UA })).text();
              const dcm = (m.match(/dcmNo['"]?\s*[:=]\s*['"]?(\d{6,})/) || m.match(/viewDoc\('\d+',\s*'(\d+)'/) || [])[1];
              const nodes = [];
              for (const blk of m.split(/var\s+node\d+\s*=\s*\{\};/).slice(1)) {
                const g = (k) => (blk.match(new RegExp(`\\['${k}'\\]\\s*=\\s*"([^"]*)"`)) || [])[1];
                if (g('dcmNo')) nodes.push([0, g('rcpNo'), g('dcmNo'), g('eleId'), g('offset'), g('length'), g('dtd'), g('text')]);
              }
              if (!nodes.length) n(`[${label}] main 일부: ${m.replace(/\s+/g, ' ').slice(m.indexOf('node1') > 0 ? m.indexOf('node1') - 20 : 0, (m.indexOf('node1') > 0 ? m.indexOf('node1') : 0) + 600)}`);
              n(`[${label} ${rcp}] dcm ${dcm} nodes ${nodes.length}`);
              let all = '';
              for (const x of nodes.length ? nodes : [[0, rcp, dcm, '0', '0', '0', 'dart4.xsd']]) {
                const u = `https://dart.fss.or.kr/report/viewer.do?rcpNo=${x[1]}&dcmNo=${x[2]}&eleId=${x[3]}&offset=${x[4]}&length=${x[5]}&dtd=${x[6]}`;
                const h = await (await fetch(u, { headers: UA })).text();
                all += ' ' + h.replace(/<[^>]+>/g, ' ').replace(/&nbsp;/g, ' ').replace(/\s+/g, ' ');
              }
              const nm = process.env.NM; let i = 0, k = 0;
              while ((i = all.indexOf(nm, i)) >= 0 && k < 14) { n(`[${label}] …${all.slice(Math.max(0, i - 160), i + 520)}`); i += 400; k++; }
              if (!k) n(`[${label}] 「${nm}」 언급 없음 (${all.length}자) :: ${all.slice(0, 1200)}`);
            } catch (e) { n(`[${label}] 실패 ${e.message}`); }
          };
          {
            const d = await dart(process.env.PARENT || '', '20250101');
            const h = await (await fetch('https://dart.fss.or.kr/dsab007/detailSearch.ax', { method: 'POST', headers: { ...UA, 'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8', 'X-Requested-With': 'XMLHttpRequest' }, body: new URLSearchParams({ currentPage: '1', maxResults: '100', sort: 'date', series: 'desc', textCrpNm: process.env.PARENT || '', startDate: '20250101', endDate: '20261231', finalReport: 'recent' }) })).text();
            const items = [...h.matchAll(/rcpNo=(\d{14})[^>]*>([\s\S]*?)<\/a>/g)].map((m) => ({ rcp: m[1], t: m[2].replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim() }));
            n(`[목록] ${items.slice(0, 30).map((x) => `${x.rcp}:${x.t}`).join(' | ')}`);
            for (const want of [/반기보고서 \(2026\.06\)/, /회사합병결정\(종속/, /주요사항보고서\(회사합병결정\)/, /사업보고서 \(2025\.12\)/]) {
              const it = items.find((x) => want.test(x.t)); if (it) await grab(it.rcp, it.t.slice(0, 24));
            }
          }
          for (const q of [process.env.NM, process.env.PARENT].filter(Boolean)) {
            try { const d = await dart(q); n(`[DART 「${q}」] ${d.status} ${d.len}자 · ${d.rows.length}건 :: ${d.rows.slice(0, 40).join(' ‖ ')}`); }
            catch (e) { n(`[DART ${q}] 실패 ${e.message}`); }
          }
          // ── 사이트 함수로 금융위·bizwiki ──
          const b = await chromium.launch();
          const page = await b.newPage();
          await page.goto(process.env.SITE.replace(/\/$/, '') + '/');
          await page.evaluate((s) => { localStorage.clear(); localStorage.setItem('vs_proxy', s.replace(/\/$/, '') + '/api/proxy'); }, process.env.SITE);
          await page.reload(); await page.waitForTimeout(2500);
          const out = await page.evaluate(async ({ nm, bz }) => {
            const r = [];
            for (const q of [nm, `주식회사${nm}`, `(주)${nm}`, `주식회사 ${nm}`]) {
              try { const d = await proxyGet('corp', { name: q, rows: '100' }); const c = window.mapCorpCandidates(d); r.push(`[금융위 기업 「${q}」] ${c.length}건 :: ${c.slice(0, 6).map((x) => `${x.corpNm}/${x.crno}/${x.bzno}`).join(' · ')}`); }
              catch (e) { r.push(`[금융위 기업 ${q}] 실패 ${e.message}`); }
            }
            try { const d = await proxyGet('corp', { bzno: bz, rows: '10' }); const c = window.mapCorpCandidates(d); r.push(`[금융위 기업 사업자번호] ${c.length}건 :: ${c.map((x) => `${x.corpNm}/${x.crno}`).join(' · ')}`); } catch (e) { r.push('[금융위 사업자번호] 실패 ' + e.message); }
            let crno = null;
            try { const w = await bizWebLookup(bz); r.push(`[bizwiki] ${JSON.stringify(w)}`); crno = w && w.crno; } catch (e) { r.push('[bizwiki] 실패 ' + e.message); }
            if (crno) {
              try { const f = await financeLookup(crno); r.push(`[금융위 재무 ${crno}] ${JSON.stringify(f).slice(0, 1500)}`); } catch (e) { r.push(`[금융위 재무 ${crno}] 실패 ${e.message}`); }
            }
            return r;
          }, { nm: process.env.NM, bz: process.env.BZ });
          out.forEach(n);
          await b.close();
          JS
          node d.mjs
